[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Link scurt de anulare din SMS: /a/<cod>
[[redirects]]
  from = "/a/*"
  to = "/anulare.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex"
    X-Frame-Options = "DENY"
