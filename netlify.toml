# Proiectul e în folderul barbershop-programari/.
# Configul ăsta din rădăcină îi spune lui Netlify unde să caute.
[build]
  publish = "barbershop-programari/public"
  functions = "barbershop-programari/netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/a/*"
  to = "/anulare.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex"
    X-Frame-Options = "DENY"
